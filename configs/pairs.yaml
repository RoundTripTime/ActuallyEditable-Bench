# Pair usage policy (not part of the metric contract).
# 2026-10-14: synthetic pairs are archived — kept on disk / in the database unchanged, but not generated further and not
# used to build evaluation datasets. Evaluation uses observed (real) pairs that a human verified.
synthetic:
  status: archived            # active | archived
  use_for_evaluation: false
  generate_new: false
observed:
  use_for_evaluation: verified_only     # only observed_verified pairs (formbench corpus review-pairs) enter datasets
  family_candidates: false              # 2026-10-15: no pairs without publisher evidence (template-family guesses crossed institutions and formats)
