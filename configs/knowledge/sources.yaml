# Verified official-source catalog for a document-editing benchmark
# Sources are referenced by URL; this manifest does not redistribute vendor content.
# Ingestion must respect each source's terms, robots directives, and attribution requirements.
#
# Entries up to writer_shortcuts_online (exclusive) were given by the user on 2026-10-16 and are kept as given;
# later entries were added under the same rules. Every entry is fetched by `formbench kb fetch` through the
# policy-gated collector (robots / terms / rate limits), snapshotted by sha256 under data/knowledge/ (git-ignored,
# never redistributed), and `formbench kb verify` checks that every fact in facts.yaml quotes its snapshot verbatim.
manifest_version: '1.0'
retrieval_layers:
  - id: editor_operations
    purpose: "Actual editor actions, shortcuts, menus, prerequisites, and side effects"
  - id: format_semantics
    purpose: "Native document objects, package layout, XML schema and relationships"
  - id: cost_model
    purpose: "Published human-performance models used only for the auxiliary time estimate (KLM)"
