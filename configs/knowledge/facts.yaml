    quote: '블록을 설정한 상태에서 글자판을 눌러 입력을 시작하면, 블록으로 설정된 부분이 지워지면서 그 자리에 새로운 내용이 입력됩니다.'
  - id: hangul.delete_block_keys
    editor: hangul
    source: hancom_erase
    concept: delete_selection
    context: a block is set
    action: {keys: Delete / BackSpace}
    ui_action: 'key:Delete|key:BackSpace'
    effect: 'same as [지우기]: the block is deleted'
    quote: '블록을 설정한 상태에서 <Delete>나 <BackSpace>를 눌러도 [지우기]와 똑같이 동작합니다.'
  - id: hangul.mouse_drag_block
    editor: hangul
    source: hancom_block
    concept: mouse_drag_select
    context: pointer in text
    action: {mouse: press and drag}
    ui_action: 'mouse:drag_text'
    effect: block set to where the mouse is released
    quote: '마우스 왼쪽 단추를 누른 채로 블록으로 설정할 내용의 끝 부분까지 마우스를 끕니다.'
  - id: hangul.triple_click_paragraph
    editor: hangul
    source: hancom_block
    concept: mouse_triple_click
    context: pointer over a word in body text
    action: {mouse: triple-click}
    ui_action: 'mouse:triple_click'
    effect: the paragraph becomes a block
    effect_detail: paragraph in Hangul and Word, sentence in Writer
    quote: '그리고 세 번 누르면 그 문단이 블록으로 설정됩니다.'
  - id: hangul.cell_block_f5
    editor: hangul
    source: hancom_block
    concept: select_cells
    context: caret in a table
    action: {keys: F5 F5 then arrows}
    ui_action: 'key:F5,F5+Arrow'
    effect: cell block extends with the arrow keys
    quote: '먼저 표 안에서 <F5>를 연속해서 두 번 누른 다음, 각 방향 화살표 키를 누르면'
  - id: hangul.arrow_one_char
    editor: hangul
    source: hancom_mouse
    concept: arrow_keys_in_text
    context: caret in text
    action: {keys: ←}
    ui_action: 'key:Arrow'
    effect: one character to the left
    quote: '← 한 글자 왼쪽으로 움직입니다.'
  - id: word.line_end_key
