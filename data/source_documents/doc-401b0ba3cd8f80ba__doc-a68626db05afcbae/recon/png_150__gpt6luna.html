<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>事業計画書（概要書）</title>
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; font-family: "Yu Mincho", "游明朝", "MS Mincho", serif; font-size: 12pt; color: #000; }
  .page { position: relative; width: 210mm; height: 297mm; box-sizing: border-box; }
  .title { position: absolute; top: 25mm; left: 0; width: 100%; text-align: center; }
  .applicant { position: absolute; top: 38mm; left: 104mm; line-height: 1.6; }
  .section { position: absolute; left: 31mm; }
  .s1 { top: 64mm; }
  .s2 { top: 108mm; }
  .sub { position: absolute; left: 32mm; }
  .sub1 { top: 117mm; }
  .sub2 { top: 153mm; }
  .sub3 { top: 189mm; }
  .sub4 { top: 225mm; }
  .continuation { position: absolute; top: 24mm; left: 32mm; }
  .s3 { top: 57mm; }
  .s4 { top: 89mm; }
  .funding { position: absolute; top: 95mm; left: 30mm; width: 135mm; line-height: 1.6; }
  table { border-collapse: collapse; font: inherit; }
  .funding td { padding: 0 2mm 0 0; vertical-align: top; }
  .sum { border-bottom: 1px solid #000; }
  .second-sum { position: absolute; top: 128mm; left: 134mm; border-bottom: 1px solid #000; }
</style>
</head>
<body>
  <div class="page">
    <div class="title">事　業　計　画　書（概要書）</div>
    <div class="applicant">申請者（転用事業者）<br>住所<br>氏名</div>
    <div class="section s1">１． 転用行為の利用目的・必要性</div>
    <div class="section s2">２． 土地利用計画<br>　（面積の妥当性）</div>
    <div class="sub sub1">（進入路）</div>
    <div class="sub sub2">（取水・排水計画）</div>
    <div class="sub sub3">（造成計画）</div>
    <div class="page">
      <div class="continuation">（周辺農地等への影響・防除策）</div>
      <div class="section s3">３． 転用事業の実施予定時期</div>
      <div class="section s4">４． 資金計画（概算）</div>
      <div class="funding">
        必要経費
        <table>
          <tr><td>建築工事費</td><td>円、その他経費</td><td>万円</td></tr>
          <tr><td colspan="2" class="sum">計　万円</td></tr>
        </table>
        資金内容
        <table>
          <tr><td>自己資金</td><td>万円</td></tr>
        </table>
      </div>
      <div class="second-sum">計　　　　　万円</div>
    </div>
  </div>
</body>
</html>
