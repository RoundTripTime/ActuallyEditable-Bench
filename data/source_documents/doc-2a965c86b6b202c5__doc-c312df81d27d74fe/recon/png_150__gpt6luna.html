<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; color: #000; }
  .page { width: 940px; margin: 120px auto 0; }
  .title { text-align: right; font-size: 32px; white-space: nowrap; }
  .title .line { display: inline-block; width: 430px; border-bottom: 2px solid #000; vertical-align: middle; }
  .date { text-align: right; font-size: 24px; margin: 0 40px 2px 0; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  td { border: 1px solid #333; }
  .top td { height: 90px; font-size: 26px; }
  .company { width: 64%; padding-left: 4px; }
  .reg { width: 10%; font-size: 24px; line-height: 1.35; text-align: center; }
  .topblank { width: 26%; }
  .number { height: 92px; text-align: center; font-size: 24px; }
  .head td { height: 190px; font-size: 24px; text-align: center; }
  .name { width: 14%; text-align: left !important; }
  .birthdate { width: 8%; line-height: 1.4; }
  .birthplace { width: 10%; }
  .job { width: 8%; }
  .address { width: 32%; }
  .property { width: 18%; }
  .membership { width: 10%; line-height: 1.4; }
  .entry td { height: 159px; }
  .sign td { height: 158px; font-size: 26px; padding-left: 4px; }
</style>
</head>
<body>
<div class="page">
  <div class="title"><span class="line"></span>合作社清算人就任報告書</div>
  <div class="date">年　月　日</div>
  <table class="top">
    <tr>
      <td class="company">社名：</td>
      <td class="reg">登記證<br>字號</td>
      <td class="topblank"></td>
    </tr>
  </table>
  <table>
    <tr><td class="number" colspan="7">本社奉令或陳准解散之公文字號</td></tr>
    <tr class="head">
      <td class="name">姓　名</td>
      <td class="birthdate">出　生<br>年　月<br>日</td>
      <td class="birthplace">出 生 地</td>
      <td class="job">職　業</td>
      <td class="address">住　　　　　　　　　　　　　址</td>
      <td class="property">財 產 生 方 式</td>
      <td class="membership">是　員<br>否　或<br>本　職<br>社　員</td>
    </tr>
    <tr class="entry"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="entry"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="entry"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="entry"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="entry"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr class="sign"><td colspan="7">合作社清算人：</td></tr>
  </table>
</div>
</body>
</html>
