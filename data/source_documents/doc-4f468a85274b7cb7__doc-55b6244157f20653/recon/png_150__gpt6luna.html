<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>委 任 書</title>
</head>
<body style="font-family: sans-serif; color: #000;">
<div style="width: 88.5%; margin: 0 auto;">
  <div style="margin: 0 0 58px 18%; font-size: 32px; letter-spacing: 8px;">委 任 書</div>

  <table style="width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 22px;">
    <colgroup>
      <col style="width: 10.2%;">
      <col style="width: 23%;">
      <col style="width: 6.8%;">
      <col style="width: 11.5%;">
      <col style="width: 14.9%;">
      <col style="width: 23%;">
      <col style="width: 10.6%;">
    </colgroup>
    <tr style="height: 100px;">
      <td style="border: 1px solid; padding: 6px 10px;">稱謂</td>
      <td style="border: 1px solid; padding: 6px 12px;">姓名</td>
      <td style="border: 1px solid; padding: 6px 8px;">性別</td>
      <td style="border: 1px solid; padding: 6px 12px;">出生<br>年月日</td>
      <td style="border: 1px solid; padding: 6px 12px;">身分證字號</td>
      <td style="border: 1px solid; padding: 6px 12px;">住(居)所</td>
      <td style="border: 1px solid; padding: 6px 10px;">聯絡電<br>話或手<br>機</td>
    </tr>
    <tr style="height: 95px;">
      <td style="border: 1px solid; padding: 6px 10px;">委任人</td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
    </tr>
    <tr style="height: 89px;">
      <td style="border: 1px solid; padding: 6px 10px;">法定代<br>理人</td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
    </tr>
    <tr style="height: 106px;">
      <td style="border: 1px solid; padding: 6px 10px;">受任人</td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
    </tr>
    <tr style="height: 174px;">
      <td style="border: 1px solid; padding: 6px 10px;">委任代<br>理人</td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
      <td style="border: 1px solid;"></td>
    </tr>
    <tr>
      <td colspan="7" style="border: 1px solid; height: 790px; vertical-align: top; padding: 60px 12px 20px; line-height: 2.25;">
        <div style="padding-left: 7%; white-space: pre;">茲與　　　　間因　　　　所衍生消費爭議事件，委任　　　　為代理人，有代</div>
        <div style="white-space: pre;">為一切協商/調解之權，並有同意協商/調解條件、撤回、捨棄、領取系爭物或選任代理人等特別</div>
        <div style="white-space: pre;">代理權。</div>

        <div style="margin: 54px 0 0 3%; line-height: 1.8;">
          <div>此　致</div>
          <div style="margin-top: 4px;">桃園市政府地政局</div>
        </div>

        <div style="margin: 68px 0 0 28%; line-height: 1.7;">
          <div>委任人</div>
          <div style="margin-left: -13%;">（委任代理人）：　　　　（簽名或蓋章-負責人印章）</div>
        </div>

        <div style="margin: 48px 0 0 28%; line-height: 1.7;">
          <div>受任人　　　　　　（簽名或蓋章）</div>
        </div>

        <div style="margin-top: 132px; text-align: center; letter-spacing: 8px;">中 華 民 國　　年　　月　　日</div>
      </td>
    </tr>
  </table>
</div>
</body>
</html>
