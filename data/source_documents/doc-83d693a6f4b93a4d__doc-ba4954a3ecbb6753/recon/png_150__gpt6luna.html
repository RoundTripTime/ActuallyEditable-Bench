<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@page { size: A4; margin: 0; }
body { margin: 0; font-family: "Yu Mincho", "MS Mincho", serif; color: #000; }
.page { box-sizing: border-box; width: 210mm; min-height: 297mm; padding: 13mm 30mm; }
table { border-collapse: collapse; }
.header { width: 100%; font-size: 14pt; }
.header td { padding: 0; }
.date { text-align: right; padding-top: 3mm !important; }
.recipient { padding-top: 8mm !important; }
.title { text-align: center; font-size: 20pt; letter-spacing: 1.2em; padding-top: 15mm; padding-left: 1.2em; }
.statement { margin-top: 22mm; font-size: 14pt; line-height: 1.8; white-space: nowrap; }
.signature { width: 38%; margin: 18mm 0 0 auto; font-size: 14pt; }
.signature td { padding: 0; }
.address { text-align: right; }
.name { padding-top: 7mm !important; text-align: center; }
.seal { padding-top: 7mm !important; text-align: right; }
</style>
</head>
<body>
<div class="page">
<table class="header">
<tr><td>別記様式第２号</td><td class="date">年　　　月　　　日</td></tr>
<tr><td class="recipient">中標津町長　様</td><td></td></tr>
</table>

<div class="title">誓　約　書</div>

<div class="statement">
<div style="padding-left: 11mm;">年度、中標津町狩猟免許新規取得等補助金の交付を受けるにあたり、狩猟者登録を</div>
<div>受けた年度の翌年度から　３　年間、中標津町鳥獣被害対策実施隊に所属し、有害鳥獣の捕獲</div>
<div>対策事業に関する業務に従事することを誓約します。</div>
</div>

<table class="signature">
<tr><td class="address">住　　所</td></tr>
<tr><td class="name">氏　名</td><td class="seal">印</td></tr>
</table>
</div>
</body>
</html>
