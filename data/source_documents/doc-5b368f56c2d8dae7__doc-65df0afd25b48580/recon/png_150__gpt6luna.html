<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>収支予算書</title>
</head>
<body style="width:794px;margin:0 auto;padding:80px 0;font-family:'Noto Serif CJK JP','Yu Mincho',serif;font-size:20px;color:#111;line-height:1.5;">
<div style="margin-left:0;">様式第３号（第８条関係）</div>
<div style="text-align:center;margin-top:8px;">収支予算書</div>

<div style="display:flex;justify-content:space-between;margin-top:8px;">
<span>1　収入予算</span>
<span>（単位：円）</span>
</div>
<table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:20px;text-align:center;">
<colgroup><col style="width:26.5%;"><col style="width:18%;"><col style="width:55.5%;"></colgroup>
<tr style="height:56px;">
<td style="border:1px solid #444;">項　目</td>
<td style="border:1px solid #444;">金　額</td>
<td style="border:1px solid #444;">内　容</td>
</tr>
<tr style="height:56px;">
<td style="border:1px solid #444;">市補助金</td>
<td style="border:1px solid #444;text-align:right;padding-right:10px;color:red;">200,000</td>
<td style="border:1px solid #444;"></td>
</tr>
<tr style="height:56px;">
<td style="border:1px solid #444;">自己資金</td>
<td style="border:1px solid #444;text-align:right;padding-right:10px;color:red;">100,000</td>
<td style="border:1px solid #444;"></td>
</tr>
<tr style="height:56px;">
<td style="border:1px solid #444;">その他</td>
<td style="border:1px solid #444;"></td>
<td style="border:1px solid #444;"></td>
</tr>
<tr style="height:58px;">
<td style="border:3px double #444;">合　計</td>
<td style="border:3px double #444;text-align:right;padding-right:10px;color:red;">300,000</td>
<td style="border:3px double #444;"></td>
</tr>
</table>
<div style="margin-left:10px;">（注）　補助率及び補助上限は、別表第４を参照すること。</div>

<div style="display:flex;justify-content:space-between;margin-top:34px;">
<span>2　支出予算</span>
<span>（単位：円）</span>
</div>
<table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:20px;text-align:center;">
<colgroup><col style="width:26.5%;"><col style="width:18%;"><col style="width:55.5%;"></colgroup>
<tr style="height:49px;">
<td style="border:1px solid #444;">項　目</td>
<td style="border:1px solid #444;">金　額</td>
<td style="border:1px solid #444;">内　容</td>
</tr>
<tr style="height:116px;color:red;">
<td style="border:1px solid #444;">システム導入費</td>
<td style="border:1px solid #444;">300,000</td>
<td style="border:1px solid #444;text-align:left;padding-left:10px;">オンラインストレージ導入に係る費用</td>
</tr>
<tr style="height:116px;"><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td></tr>
<tr style="height:116px;"><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td></tr>
<tr style="height:116px;"><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td></tr>
<tr style="height:116px;"><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td></tr>
<tr style="height:116px;"><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td><td style="border:1px solid #444;"></td></tr>
<tr style="height:57px;">
<td style="border:3px double #444;">合　計</td>
<td style="border:3px double #444;color:red;">300,000</td>
<td style="border:3px double #444;"></td>
</tr>
</table>
<div style="margin-left:10px;">（注）　「項目」は、別表第４の項目名を記入すること。</div>
</body>
</html>
