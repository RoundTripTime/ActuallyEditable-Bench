<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>登記申請書</title>
</head>
<body style="font-family: sans-serif; color: #000; width: 827px; margin: 0 auto; font-size: 16px;">
  <div style="height: 39px;"></div>
  <div style="width: 410px; height: 168px; border: 1px dashed #00d9e8; margin: 0 auto;"></div>

  <h1 style="font-size: 22px; font-weight: normal; letter-spacing: 12px; text-align: center; margin: 4px 0 30px;">登　記　申　請　書</h1>

  <div style="margin: 0 0 18px 78px;">登記の目的　　所有権移転</div>
  <div style="margin: 0 0 18px 78px;">原　　因　　令和　　年　月　　日相続</div>
  <div style="margin: 0 0 18px 78px;">相　続　人　　（被相続人　　　　　　　　　）</div>
  <div style="margin: 0 0 18px 146px;">（申請人）</div>

  <table style="border-collapse: collapse; width: 465px; margin: 0 0 20px auto;">
    <tbody>
      <tr><td style="border: 1px solid; width: 128px; padding: 6px 8px;">氏名ふりがな</td><td style="border: 1px solid; height: 26px;"></td></tr>
      <tr><td style="border: 1px solid; padding: 6px 8px;">生年月日</td><td style="border: 1px solid; height: 26px;"></td></tr>
      <tr><td style="border: 1px solid; padding: 6px 8px;">国籍等</td><td style="border: 1px solid; height: 26px;"></td></tr>
      <tr><td style="border: 1px solid; padding: 6px 8px;">メールアドレス</td><td style="border: 1px solid; height: 26px;"></td></tr>
    </tbody>
  </table>

  <div style="margin: 0 0 18px 268px;">連絡先の電話番号　　－　　－</div>
  <div style="margin: 0 0 0 78px;">添付情報</div>
  <div style="margin: 0 0 18px 126px;">登記原因証明情報　住所証明情報　国籍等を証する情報</div>
  <div style="margin: 0 0 18px 78px;">□登記識別情報の通知を希望しません。</div>
  <div style="margin: 0 0 18px 78px;">令和　　年　月　　日申請　　　　法務局</div>
  <div style="margin: 0 0 18px 78px;">課税価格　金　　　　円</div>
  <div style="margin: 0 0 18px 78px;">登録免許税　金　　　　円</div>

  <div style="margin: 0 0 0 78px;">不動産の表示</div>
  <table style="border-collapse: collapse; margin-left: 102px;">
    <tbody>
      <tr>
        <td style="width: 155px; vertical-align: top;">
          不動産番号<br>
          所　在<br>
          地　番<br>
          地　目<br>
          地　積
        </td>
        <td style="width: 210px; vertical-align: top;">
          不動産番号<br>
          所　在<br>
          家屋番号<br>
          種　類<br>
          構　造<br>
          床　面　積
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
