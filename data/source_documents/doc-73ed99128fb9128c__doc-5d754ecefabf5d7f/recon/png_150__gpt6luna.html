<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>営業所一覧表</title>
<style>
  body { font-family: "明朝", "ＭＳ 明朝", serif; color: #000; }
  .page { width: 1480px; margin: 0 auto; }
  h1 { margin: 88px 0 44px; text-align: center; font-size: 46px; font-weight: normal; letter-spacing: 0.55em; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 27px; }
  th, td { border: 2px solid #000; padding: 0; }
  th { height: 91px; text-align: center; font-weight: normal; }
  td { height: 117px; vertical-align: top; }
  .col1 { width: 34.25%; }
  .col2 { width: 20.7%; }
  .col3 { width: 27.35%; }
  .col4 { width: 17.7%; }
  .label { padding: 5px 24px; }
  .notes { margin-top: 6px; font-size: 23px; line-height: 1.62; }
  .notes-title { margin-bottom: 4px; }
  .note { margin-left: 27px; padding-left: 0; }
  .indent { display: inline-block; width: 40px; }
</style>
</head>
<body>
<div class="page">
  <h1>営業所一覧表</h1>
  <table>

  <div class="notes">
    <div class="notes-title">記載要項</div>
    <div class="note">１．入札、見積及び契約の締結、契約履行等の権限を支社、支店、営業所等に委任したい場合、一ヶ所に限りその名称等を「入札等の<br><span class="indent"></span>権限を委任されるもの」の欄に記載してください。</div>
    <div class="note">２．「入札等の権限を委任されるもの」の欄に記載した場合必ず委任状及び使用印鑑届を提出してください。</div>
    <div class="note">３．「入札等の権限を委任されるもの」以外に県内に支社、営業所等がある場合「その他のもの」の欄に記入してください。</div>
