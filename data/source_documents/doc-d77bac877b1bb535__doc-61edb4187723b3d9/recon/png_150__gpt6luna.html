<!doctype html>

<div style="width:210mm; min-height:297mm; box-sizing:border-box; padding:25mm; font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif; font-size:12pt; color:#000;">
  <div style="margin:5mm 0 7mm; line-height:1.35;">
    <div>別記様式第１５号（第１１条関係）</div>

    </tr>
