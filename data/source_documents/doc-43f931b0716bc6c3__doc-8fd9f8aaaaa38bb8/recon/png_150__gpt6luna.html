<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>豊見城市住宅リフォーム支援事業補助金交付請求書</title>
</head>
<body>
  <div style="width:900px; margin:0 auto; font-family:'Yu Mincho','MS Mincho',serif; font-size:18px; line-height:1.5;">
    <div style="height:155px;"></div>

    <div style="text-align:right; padding-right:0; margin-bottom:24px;">年　　月　　日</div>

    <table style="width:100%; border-collapse:collapse; margin-bottom:58px;">
      <tr>
        <td style="width:55%; vertical-align:top;">豊見城市長　　殿</td>
        <td style="vertical-align:top;">
          <div>（申請者）</div>
          <div style="padding-left:28px;">住　所</div>
          <div style="padding-left:28px;">氏　名　　　　　　　　　　　　印</div>
          <div style="padding-left:28px;">電話番号</div>
        </td>
      </tr>
    </table>

    <div style="text-align:center; margin-bottom:58px;">豊見城市住宅リフォーム支援事業補助金交付請求書</div>

    <p style="margin:0 0 55px; text-indent:4em;">
      年　　月　　日付け　第　　号で交付確定通知のあった補助金について、豊見城市住宅<br>
      リフォーム支援事業補助金交付要綱第14条第１項の規定により、請求します。
    </p>

    <div style="text-align:center; margin-bottom:58px;">補助金交付請求額　　　　金　　　　　　　　　円</div>

    <div style="margin-left:16px; margin-bottom:0;">（補助金の振込先）</div>
    <table style="width:100%; height:404px; border:1px solid #444; border-collapse:collapse; table-layout:fixed;">
      <colgroup>
        <col style="width:162px;">
        <col>
      </colgroup>
      <tr style="height:38px;">
        <td style="border-right:1px solid #444; text-align:center;">ふ　り　が　な</td>
        <td style="border-bottom:1px dotted #555;"></td>
      </tr>
      <tr style="height:95px;">
        <td style="border-right:1px solid #444; border-bottom:1px solid #444; text-align:center;">氏　　名</td>
        <td style="border-bottom:1px solid #444; text-align:right; padding-right:95px;">印</td>
      </tr>
      <tr style="height:95px;">
        <td style="border-right:1px solid #444; border-bottom:1px solid #444; text-align:center;">住　　所</td>
        <td style="border-bottom:1px solid #444; text-align:center;">電話番号　（　　　　　　　　　　　　　　　　）</td>
      </tr>
      <tr style="height:176px;">
        <td style="border-right:1px solid #444; text-align:center;">口座番号</td>
        <td style="padding:0;">
          <table style="width:100%; height:100%; border-collapse:collapse; table-layout:fixed;">
            <tr style="height:20%;">
              <td style="border-bottom:1px dotted #555; padding-left:12px;">金　融　機　関　名</td>
            </tr>
            <tr style="height:20%;">
              <td style="border-bottom:1px dotted #555; padding-left:12px;">支　　　店　　　名</td>
            </tr>
            <tr style="height:20%;">
              <td style="border-bottom:1px dotted #555; padding-left:12px;">預　金　種　別　　　　普通　・　当座</td>
            </tr>
            <tr style="height:20%;">
              <td style="border-bottom:1px dotted #555; padding-left:12px;">口　座　番　号</td>
            </tr>
            <tr style="height:20%;">
              <td style="padding-left:12px;">口　座　名　義</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
