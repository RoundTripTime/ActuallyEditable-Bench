<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>てん末</title>
<style>
  body {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 38mm 30mm 20mm;
    box-sizing: border-box;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    font-size: 16pt;
    font-weight: normal;
    color: #000;
  }
  table {
    border-collapse: collapse;
    table-layout: fixed;
  }
  td {
    padding: 0;
    vertical-align: middle;
  }
  .title {
    width: 100%;
    text-align: center;
    letter-spacing: 1.2em;
    padding-left: 1.2em;
  }
  .date {
    width: 100%;
    margin-top: 18mm;
    text-align: right;
  }
  .recipient {
    margin-top: 10mm;
  }
  .applicant {
    width: 62%;
    margin: 7mm 0 0 auto;
  }
  .applicant td {
    height: 13mm;
  }
  .main-heading {
    margin-top: 3mm;
  }
  .fields {
    width: 100%;
    margin-top: 6mm;
  }
  .fields td {
    height: 13mm;
  }
  .fields .left {
    width: 50%;
  }
  .fields .right {
    width: 50%;
  }
  .note {
    margin: 51mm 0 0 2mm;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="title">てん末</div>

  <div class="date">令和　　年　　月　　日</div>

  <div class="recipient">佐渡市長様</div>

  <table class="applicant">
    <tr><td>申請者　住所 佐渡市</td></tr>
    <tr><td>氏名</td></tr>
  </table>

  <div class="main-heading">下記自動車の登録番号紛失のてん末</div>

  <table class="fields">
    <tr>
      <td class="left">登録番号</td>
      <td class="right">車体番号</td>
    </tr>
    <tr>
      <td class="left">車　　名</td>
      <td class="right">エンジン番号</td>
    </tr>
    <tr>
      <td class="left">型　　式</td>
      <td class="right">認定番号</td>
    </tr>
    <tr>
      <td class="left">取得日　　　　年　　月　　日</td>
      <td class="right"></td>
    </tr>
    <tr>
      <td class="left">内　　容</td>
      <td class="right"></td>
    </tr>
  </table>

  <p class="note">（注）紛失日時、紛失区間、届出警察署又は駐在所を明記の上詳細にてん末を<br>
  　　記入すること。</p>
</body>
</html>
