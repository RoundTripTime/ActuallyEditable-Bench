<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@page { size: A4; margin: 0; }
body { margin: 0; font-family: "Yu Mincho", "Noto Serif JP", serif; color: #000; }
.page { box-sizing: border-box; width: 210mm; min-height: 297mm; padding: 48mm 30mm 25mm; }
.title { text-align: center; font-size: 22pt; letter-spacing: 0.55em; margin: 0 0 14mm; }
table { border-collapse: collapse; }
.fields { width: 100%; font-size: 14pt; }
.fields td { padding: 0; height: 13mm; vertical-align: bottom; }
.fields .label { width: 18mm; white-space: nowrap; }
.fields .line { border-bottom: 1px solid #333; padding-left: 2mm; }
.fields .indent { width: 18mm; }
.intro { font-size: 14pt; line-height: 1.65; margin-top: 17mm; }
.city-line { display: inline-block; width: 80mm; border-bottom: 1px solid #333; line-height: 1.2; }
.items { font-size: 14pt; margin-top: 12mm; }
.items-title { margin-bottom: 1mm; }
.bullets { margin: 0; padding-left: 7mm; line-height: 7mm; }
.bottom { margin-top: 33mm; font-size: 12pt; text-align: center; line-height: 1.8; }
.bottom-fields { width: 100%; margin-top: 7mm; font-size: 14pt; text-align: left; }
</style>
</head>
<body>
<div class="page">
  <div class="title">委　任　状</div>

  <table class="fields">
    <tr>
      <td class="label">代理人</td>
      <td class="line">住所</td>
    </tr>
    <tr>
      <td class="indent"></td>
      <td class="line">氏名</td>
    </tr>
  </table>

  <div class="intro">
    私は、上記のものを代理人と定め、<span class="city-line">横浜市</span><br>
    に所在する土地及び建築物に関して、次の権限を委任します。
  </div>

  <div class="items">
    <div class="items-title">委任事項</div>
    <ul class="bullets">
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
  </div>

  <div class="bottom">
    なお、上記委任事項に関連する個人情報について代理人に提供することに同意します。<br>
    令和　年　月　日<br>
    （委任状作成年月日）
  </div>

  <table class="fields bottom-fields">
    <tr>
      <td class="label">本人</td>
      <td class="line">住所</td>
    </tr>
    <tr>
      <td class="indent"></td>
      <td class="line">氏名</td>
    </tr>
    <tr>
      <td class="indent"></td>
      <td class="line">電話番号</td>
    </tr>
  </table>
</div>
</body>
</html>
