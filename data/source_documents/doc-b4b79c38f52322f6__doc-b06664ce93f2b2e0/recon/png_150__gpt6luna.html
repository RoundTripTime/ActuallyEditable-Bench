<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 portrait; margin: 8mm; }
  body { margin: 0; font-family: "Yu Mincho", "Noto Serif CJK JP", serif; color: #111; }
  .form {
    width: 172mm;
    height: 270mm;
    margin: 0 auto;
    border: 1px solid #111;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .form > tbody > tr > td { padding: 0; }
  .left { width: 79mm; vertical-align: top; }
  .data { width: 76mm; vertical-align: top; }
  .title {
    width: 17mm;
    border-left: 1px solid #111;
    text-align: center;
    vertical-align: middle;
    font-size: 18pt;
    line-height: 2.5;
    writing-mode: vertical-rl;
    text-orientation: upright;
  }
  .left-layout {
    width: 100%;
    height: 270mm;
    table-layout: fixed;
    border-collapse: collapse;
  }
  .left-layout td {
    border: 0;
    padding: 0;
    text-align: center;
    vertical-align: top;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 11pt;
    line-height: 1.45;
  }
  .governor { width: 18%; padding-top: 6mm !important; }
  .name { width: 8%; padding-top: 59mm !important; }
  .kana { width: 8%; padding-top: 59mm !important; font-size: 9pt !important; }
  .new-address { width: 16%; padding-top: 59mm !important; }
  .old-address { width: 16%; padding-top: 59mm !important; }
  .date { width: 12%; padding-top: 21mm !important; }
  .notice { width: 22%; padding-top: 6mm !important; }
  .data-table {
    width: 100%;
    height: 270mm;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .data-table td {
    border-right: 1px solid #111;
    border-bottom: 1px solid #555;
    padding: 0;
    text-align: center;
    vertical-align: middle;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 11pt;
  }
  .data-table tr:first-child { height: 21%; }
  .data-table tr:nth-child(2) { height: 17%; }
  .data-table tr:nth-child(3) { height: 18%; }
  .data-table tr:nth-child(4) { height: 25%; }
  .data-table tr:nth-child(5) { height: 19%; }
  .data-table td:last-child { border-right: 0; }
  .data-table tr:last-child td { border-bottom: 0; }
  .header-cell { position: relative; }
  .header-label { display: block; }
  .header-number { display: block; margin-top: auto; }
  .header-content {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 3mm 0 2mm;
    box-sizing: border-box;
  }
  .register .header-content { justify-content: flex-start; }
  .register .header-label { line-height: 2.3; }
  .row-label { line-height: 2.1; }
  .length-label { line-height: 1.8; }
</style>
</head>
<body>
<table class="form">
  <tbody>
    <tr>
      <td class="left">
        <table class="left-layout">
          <tbody>
            <tr>
              <td class="governor">栃木県知事<br><br>殿</td>
              <td class="name">氏<br><br>名</td>
              <td class="kana">ふりがな</td>
              <td class="new-address">新住所</td>
              <td class="old-address">旧住所</td>
              <td class="date">令和<br><br>年<br><br>月<br><br>日</td>
              <td class="notice">左のとおり住所を変更したので届け出ます。</td>
            </tr>
          </tbody>
        </table>
      </td>
      <td class="data">
        <table class="data-table">
          <colgroup>
            <col style="width:20%">
            <col style="width:20%">
            <col style="width:20%">
            <col style="width:20%">
            <col style="width:20%">
          </colgroup>
          <tbody>
            <tr>
              <td class="header-cell">
                <div class="header-content"><span class="header-label">〃<br>第</span><span class="header-number">号</span></div>
              </td>
              <td class="header-cell">
                <div class="header-content"><span class="header-label">〃<br>第</span><span class="header-number">号</span></div>
              </td>
              <td class="header-cell">
                <div class="header-content"><span class="header-label">〃<br>第</span><span class="header-number">号</span></div>
              </td>
              <td class="header-cell">
                <div class="header-content"><span class="header-label">栃木県第</span><span class="header-number">号</span></div>
              </td>
              <td class="header-cell register">
                <div class="header-content"><span class="header-label">登録記号番号</span></div>
              </td>
            </tr>
            <tr>
              <td></td><td></td><td></td><td></td>
              <td class="row-label">種別</td>
            </tr>
            <tr>
              <td></td><td></td><td></td><td></td>
              <td class="length-label">長さ（刀剣類）<br>全長（銃砲）</td>
            </tr>
            <tr>
              <td></td><td></td><td></td><td></td>
              <td class="row-label">銘文</td>
            </tr>
            <tr>
              <td></td><td></td><td></td><td></td>
              <td class="row-label">住所変更年月日</td>
            </tr>
          </tbody>
        </table>
      </td>
      <td class="title">住所変更届出書</td>
    </tr>
  </tbody>
</table>
</body>
</html>
