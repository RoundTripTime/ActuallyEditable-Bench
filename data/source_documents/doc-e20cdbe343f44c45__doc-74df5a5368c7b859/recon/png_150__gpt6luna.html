<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 portrait; margin: 0; }
  body {
    margin: 0;
    color: #111;
    font-family: "游明朝", "Yu Mincho", "ＭＳ 明朝", serif;
    font-size: 16pt;
  }
  .page {
    width: 1241px;
    min-height: 1754px;
    box-sizing: border-box;
    padding-top: 181px;
    margin: 0 auto;
  }
  .form-number { margin-left: 177px; }
  .title {
    margin-top: 39px;
    text-align: center;
  }
  .addressee {
    margin-top: 40px;
    margin-left: 177px;
    word-spacing: 70px;
  }
  .date {
    margin-top: 75px;
    margin-left: 866px;
    word-spacing: 30px;
  }
  .submitter {
    margin-top: 40px;
    text-align: center;
  }
  .intro {
    width: 885px;
    margin: 42px auto 3px;
  }
  table {
    width: 885px;
    margin: 0 auto;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 16pt;
  }
  td {
    border: 1px solid #222;
    padding: 0 10px;
    vertical-align: middle;
  }
  .label {
    width: 162px;
    text-align: right;
    white-space: pre-line;
    line-height: 1.65;
  }
  .blank { height: 81px; }
  .row-label td { height: 81px; }
  .columns th {
    border: 1px solid #222;
    height: 81px;
    padding: 0 8px;
    font-weight: normal;
    white-space: nowrap;
    text-align: center;
  }
  .columns .c1 { width: 242px; }
  .columns .c2, .columns .c3, .columns .c4 { width: 191px; }
  .entry td { height: 438px; }
</style>
</head>
<body>
<div class="page">
  <div class="form-number">様式第5号（第7条関係）</div>
  <div class="title">指定給水装置工事事業者指定事項変更届出書</div>
  <div class="addressee">つくばみらい市長　様</div>
  <div class="date">年　月　日</div>
  <div class="submitter">届出者</div>
  <div class="intro">水道法第25条の7の規定に基づき、次のとおり変更の届出をします。</div>
  <table>
    <colgroup>
      <col style="width:162px">
      <col style="width:723px">
    </colgroup>
    <tr class="row-label">
      <td class="label">フ　リ　ガ　ナ<br>氏名又は名称</td>
      <td class="blank"></td>
    </tr>
    <tr class="row-label">
      <td class="label">住　　所</td>
      <td class="blank"></td>
    </tr>
    <tr class="row-label">
      <td class="label">フ　リ　ガ　ナ<br>代表者の氏名</td>
      <td class="blank"></td>
    </tr>
  </table>
  <table class="columns">
    <colgroup>
      <col class="c1">
      <col class="c2">
      <col class="c3">
      <col class="c4">
    </colgroup>
    <tr>
      <th>変　更　に　係　る　事　項</th>
      <th>変　更　前</th>
      <th>変　更　後</th>
      <th>変　更　年　月　日</th>
    </tr>
    <tr class="entry">
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </table>
</div>
</body>
</html>
