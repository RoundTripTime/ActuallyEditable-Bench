<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@page { size: A4; margin: 0; }
body { margin: 0; font-family: "Yu Mincho", "Noto Serif CJK JP", serif; color: #000; }
.page { box-sizing: border-box; width: 210mm; min-height: 297mm; padding: 32mm 30mm 20mm 31mm; font-size: 12pt; }
.title { text-align: center; font-size: 16pt; letter-spacing: 0.5em; margin: 0 0 10mm; }
.date { text-align: right; margin: 0 0 1mm; }
.recipient { margin: 0 0 7mm; }
table { border-collapse: collapse; }
.identity { width: 100%; margin-left: 50mm; }
.identity td { padding: 0; height: 6.3mm; vertical-align: top; white-space: pre; }
.identity .label { width: 30mm; }
.identity .sub { padding-left: 0; }
.agent { margin-top: 7mm; }
.sections { width: 100%; margin-top: 7mm; }
.sections td { vertical-align: top; padding: 0; }
.sections .num { width: 7.5mm; }
.sections tr.s1 td { height: 25mm; }
.sections tr.s2 td { height: 19mm; }
.sections tr.s3 td { height: 19mm; }
.sections tr.s4 td { height: 31mm; }
.sections tr.s5 td { height: 24mm; }
.sections tr.s6 td { height: auto; }
</style>
</head>
<body>
<div class="page">
  <p class="title">審　査　請　求　書</p>
  <p class="date">年　　月　　日</p>
  <p class="recipient">石川県後期高齢者医療審査会会長　殿</p>

  <table class="identity">
    <tr><td class="label">審査請求人</td><td>住　　所</td></tr>
    <tr><td></td><td>ふりがな</td></tr>
    <tr><td></td><td>氏　　名</td></tr>
    <tr><td></td><td>生年月日　　　年　　月　　日（　　歳）</td></tr>
    <tr><td></td><td>電話番号　　　―　　　―</td></tr>
    <tr><td></td><td>被保険者番号</td></tr>
  </table>

  <table class="identity agent">
    <tr><td class="label">代　理　人</td><td>住　　所</td></tr>
    <tr><td></td><td>ふりがな</td></tr>
    <tr><td></td><td>氏　　名</td></tr>
    <tr><td></td><td>電話番号　　　―　　　―</td></tr>
  </table>

  <table class="sections">
    <tr class="s1"><td class="num">1</td><td>審査請求に係る処分</td></tr>
    <tr class="s2"><td class="num">2</td><td>審査請求に係る処分があったことを知った日<br>　　　　　　　　　年　　月　　日</td></tr>
    <tr class="s3"><td class="num">3</td><td>審査請求の趣旨</td></tr>
    <tr class="s4"><td class="num">4</td><td>審査請求の理由</td></tr>
    <tr class="s5"><td class="num">5</td><td>処分庁の教示の有無及びその内容</td></tr>
    <tr class="s6"><td class="num">6</td><td>添付書類（処分に関する決定通知書の写し等）</td></tr>
  </table>
</div>
</body>
</html>
