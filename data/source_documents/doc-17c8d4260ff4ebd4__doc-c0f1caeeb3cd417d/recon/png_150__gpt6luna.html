<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>協議書</title>
<style>
  @page { size: A4; margin: 0; }
  body {
    box-sizing: border-box;
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 27mm 25mm 20mm;
    color: #111;
    font-family: "Yu Mincho", "Noto Serif CJK JP", serif;
    font-size: 14pt;
  }
  .form-no { margin: 0 0 2mm; }
  .title {
    margin: 0 0 2mm;
    text-align: center;
    letter-spacing: 1em;
    padding-left: 1em;
  }
  .addressee { margin: 0 0 3mm; }
  .opening { margin: 0 0 9mm; }
  .blank-line {
    display: inline-block;
    width: 26mm;
    border-bottom: 1px solid #111;
  }
  .agreement { width: 100%; margin: 0 0 8mm; }
  .details {
    width: 43%;
    margin-left: auto;
    border-collapse: collapse;
    line-height: 1.65;
  }
  .details td { padding: 0; white-space: nowrap; }
  .details .date { letter-spacing: .6em; }
  .details .seal { text-align: right; }
  .contents {
    width: 100%;
    height: 30mm;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .contents th, .contents td { border: 1px solid #333; }
  .contents th {
    height: 7mm;
    font-weight: normal;
    text-align: center;
    letter-spacing: .8em;
    padding-left: .8em;
  }
  .contents .result-col { width: 24%; }
  .contents .blank-row { height: 23mm; }
  .contents .result {
    text-align: center;
    white-space: nowrap;
  }
  .signer {
    width: 45%;
    margin: 0 0 9mm auto;
    border-bottom: 1px solid #111;
    text-align: center;
    letter-spacing: .8em;
    padding-left: .8em;
  }
  .signer span { float: right; letter-spacing: 0; }
  .note { margin: 0; white-space: nowrap; }
</style>
</head>
<body>
  <p class="form-no">様式第４号（第２条関係）</p>
  <p class="title">協　議　書</p>
  <p class="addressee">霧島市長　殿</p>
  <p class="opening"><span class="blank-line"></span>地区の伐採については、次のとおり協議しました。</p>

  <section class="agreement">
    <table class="details">
      <tr><td class="date">協議日</td><td>年　　月　　日</td></tr>
      <tr><td class="date">団体名</td><td></td></tr>
      <tr><td class="date">代表者名</td><td class="seal">㊞</td></tr>
    </table>
    <table class="contents">
      <colgroup><col><col class="result-col"></colgroup>
      <tr><th>協　議　内　容</th><th>協議結果</th></tr>
      <tr class="blank-row"><td></td><td class="result">承認　・　否認</td></tr>
    </table>
  </section>

  <section class="agreement">
    <table class="details">
      <tr><td class="date">協議日</td><td>年　　月　　日</td></tr>
      <tr><td class="date">団体名</td><td></td></tr>
      <tr><td class="date">代表者名</td><td class="seal">㊞</td></tr>
    </table>
    <table class="contents">
      <colgroup><col><col class="result-col"></colgroup>
      <tr><th>協　議　内　容</th><th>協議結果</th></tr>
      <tr class="blank-row"><td></td><td class="result">承認　・　否認</td></tr>
    </table>
  </section>

  <section class="agreement">
    <table class="details">
      <tr><td class="date">協議日</td><td>年　　月　　日</td></tr>
      <tr><td class="date">団体名</td><td></td></tr>
      <tr><td class="date">代表者名</td><td class="seal">㊞</td></tr>
    </table>
    <table class="contents">
      <colgroup><col><col class="result-col"></colgroup>
      <tr><th>協　議　内　容</th><th>協議結果</th></tr>
      <tr class="blank-row"><td></td><td class="result">承認　・　否認</td></tr>
    </table>
  </section>

  <p class="signer">協　議　者 <span>印</span></p>
  <p class="note">※この協議書は、団体及び代表者に責任を問うものではありません。</p>
</body>
</html>
