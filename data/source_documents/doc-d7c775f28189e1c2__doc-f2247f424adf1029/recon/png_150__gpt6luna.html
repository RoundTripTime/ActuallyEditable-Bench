<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
@page { size: A4; margin: 0; }
body { margin: 0; font-family: "Yu Mincho", "Noto Serif CJK JP", serif; font-size: 16pt; color: #000; }
.page { box-sizing: border-box; width: 210mm; height: 297mm; padding: 35mm 25mm 20mm; }
table { border-collapse: collapse; }
td { padding: 0; vertical-align: top; }
.date-top { width: 100%; text-align: right; margin: 0 0 7mm; }
.recipient { margin: 0 0 5mm; }
.owner { width: 78mm; margin: 0 0 16mm auto; line-height: 1.6; }
.title { text-align: center; margin: 0 0 11mm; }
.body-copy { margin: 0; line-height: 1.55; text-indent: 0; }
.date-body { width: 55mm; margin: 5mm 0 5mm auto; text-align: right; }
.record { text-align: center; margin: 0 0 14mm; }
.user { width: 100%; line-height: 2.2; margin-bottom: 26mm; }
.note { margin: 0; line-height: 1.5; text-indent: 0; }
</style>
</head>
<body>
<div class="page">
  <p class="date-top">年　　月　　日</p>
  <p class="recipient">豊見城市長　　殿</p>
  <table class="owner">
    <tr><td colspan="2">(借家又は共同住宅等の所有者)</td></tr>
    <tr><td>住　　所</td><td></td></tr>
    <tr><td>氏　　名</td><td></td></tr>
    <tr><td>電話番号</td><td></td></tr>
  </table>
  <p class="title">豊見城市住宅リフォーム支援事業工事完了確認書</p>
  <p class="body-copy">豊見城市住宅リフォーム支援事業に係る、下記の借家人が実施したリフォーム工事については、補<br>助金の申請時に承諾した工事内容のとおりであり、所有者として工事の完了を確認しました。</p>
  <p class="date-body">年　　月　　日</p>
  <p class="record">記</p>
  <table class="user">
    <tr><td>(住宅等の使用者)</td><td>住　所</td></tr>
    <tr><td></td><td>氏　名</td></tr>
  </table>
  <p class="note">（注）住宅等の所有者でない借家人が補助金の申請をした場合においては、豊見城市住宅リフォーム支援<br>事業補助金実績報告書（様式第10号）に添付してください。</p>
</div>
</body>
</html>
